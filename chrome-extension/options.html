<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fdf6e3;
      color: #5b4636;
      padding: 40px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #8b7355;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d6c4a5;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: #5b4636;
      outline: none;
    }
    input:focus {
      border-color: #d97706;
    }
    .hint {
      font-size: 11px;
      color: #a89272;
      margin-top: 4px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #saveBtn {
      background: #d97706;
      color: #fff;
    }
    #saveBtn:hover { background: #b45309; }
    #testBtn {
      background: #e6d5b8;
      color: #5b4636;
    }
    #testBtn:hover { background: #d6c4a5; }
    #statusMsg {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>⚙️ Apple Notes Clipper Settings</h1>

  <div class="field">
    <label>Server Port</label>
    <input type="number" id="port" placeholder="3333">
    <div class="hint">Default: 3333</div>
  </div>

  <div class="field">
    <label>Secret Token</label>
    <input type="text" id="token" placeholder="Paste token from setup.js output">
    <div class="hint">Generated during server setup</div>
  </div>

  <div class="field">
    <label>Notes Folder</label>
    <input type="text" id="notesFolder" placeholder="Media Vault">
    <div class="hint">Default: Media Vault</div>
  </div>

  <div class="buttons">
    <button id="saveBtn">Save</button>
    <button id="testBtn">Test Connection</button>
  </div>

  <div id="statusMsg"></div>

  <script src="options.js"></script>
</body>
</html>
