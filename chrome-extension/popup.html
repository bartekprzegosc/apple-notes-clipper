<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fdf6e3;
      color: #5b4636;
      padding: 24px 20px;
    }
    .logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }
    .title {
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #5b4636;
    }
    #status {
      text-align: center;
      font-size: 13px;
      margin-bottom: 16px;
    }
    #clipBtn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #clipBtn:hover:not(:disabled) {
      background: #b45309;
    }
    #clipBtn:disabled {
      background: #c4a882;
      cursor: not-allowed;
    }
    #clipStatus {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }
    .folder-info {
      text-align: center;
      font-size: 12px;
      color: #8b7355;
      margin-top: 12px;
    }
    .footer {
      text-align: center;
      margin-top: 16px;
      border-top: 1px solid #e6d5b8;
      padding-top: 12px;
    }
    .footer a {
      color: #8b7355;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }
    .footer a:hover {
      color: #5b4636;
    }
  </style>
</head>
<body>
  <div class="logo">🍎</div>
  <div class="title">Apple Notes Clipper</div>
  <div id="status"><span style="color:#9ca3af">Checking server...</span></div>
  <button id="clipBtn" disabled>📋 Clip this page</button>
  <div id="clipStatus"></div>
  <div class="folder-info">Saving to: <span id="folderName">—</span></div>
  <div class="footer">
    <a id="optionsLink">⚙️ Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
